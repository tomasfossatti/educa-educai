services:
  - type: web
    name: educai-mvp
    runtime: node
    plan: free
    # Migraciones versionadas (prisma migrate deploy). Nunca db push ni seed en el build.
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: anthropic
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
