services:
  - type: web
    name: educai-mvp
    runtime: node
    plan: free
    # Migraciones versionadas (prisma migrate deploy). Nunca db push ni seed en el build.
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: anthropic
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_WEEKLY_STUDENT_CAP_USD
        value: "2"
      - key: AI_WEEKLY_TOTAL_ALERT_USD
        value: "25"
      - key: AI_ALERT_WEBHOOK_URL
        sync: false
